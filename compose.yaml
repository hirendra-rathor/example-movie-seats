services:
  movie-seats:
    build: .
    init: true
    ports:
      - "127.0.0.1:${MOVIE_SEATS_PORT:-8000}:8000"
    environment:
      MOVIE_SEATS_DB: /data/movie-seats.sqlite3
      MOVIE_SEATS_HOLD_SECONDS: ${MOVIE_SEATS_HOLD_SECONDS:-300}
    volumes:
      - reservations:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  reservations:

<rect x="220.0" y="128" width="190" height="78" rx="7" fill="#f9fbfd" stroke="#a3a3a3" stroke-width="2.6"/>
<rect x="330.0" y="117" width="70" height="23" rx="4" fill="#a3a3a3"/>
<text x="365.0" y="133" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">context</text>
<text x="232.0" y="152" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">CALLER</text>
<text x="232.0" y="180" font-size="18" font-weight="700" fill="#182f46" text-anchor="start">Client 2</text>
<text x="232.0" y="198" font-size="13" font-weight="400" fill="#586674" text-anchor="start">booking client</text>
<path d="M315 206 V1161" stroke="#9aa9b8" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/>
<rect x="455.0" y="128" width="230" height="78" rx="7" fill="#f9fbfd" stroke="#3b82f6" stroke-width="2.6"/>
<rect x="600.0" y="117" width="75" height="23" rx="4" fill="#3b82f6"/>
<text x="637.5" y="133" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">changed</text>
<text x="467.0" y="152" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">COMPONENT</text>
<text x="467.0" y="180" font-size="18" font-weight="700" fill="#182f46" text-anchor="start">create_app routes</text>
<text x="467.0" y="198" font-size="13" font-weight="400" fill="#586674" text-anchor="start">app.py</text>
<path d="M570 206 V1161" stroke="#9aa9b8" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/>
<rect x="715.0" y="128" width="230" height="78" rx="7" fill="#f9fbfd" stroke="#22a06b" stroke-width="2.6"/>
<rect x="890.0" y="117" width="45" height="23" rx="4" fill="#22a06b"/>
<text x="912.5" y="133" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">new</text>
<text x="727.0" y="152" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">COMPONENT</text>
<text x="727.0" y="180" font-size="18" font-weight="700" fill="#182f46" text-anchor="start">Reservation book</text>
<text x="727.0" y="198" font-size="13" font-weight="400" fill="#586674" text-anchor="start">reservations.py</text>
<path d="M830 206 V1161" stroke="#9aa9b8" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/>
<rect x="995.0" y="128" width="230" height="78" rx="7" fill="#f9fbfd" stroke="#22a06b" stroke-width="2.6"/>
<rect x="1170.0" y="117" width="45" height="23" rx="4" fill="#22a06b"/>
<text x="1192.5" y="133" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">new</text>
<text x="1007.0" y="152" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">STORE</text>
<text x="1007.0" y="180" font-size="18" font-weight="700" fill="#182f46" text-anchor="start">SQLite database</text>
<text x="1007.0" y="198" font-size="13" font-weight="400" fill="#586674" text-anchor="start">instance/movie-seats.sqlite3</text>
<path d="M1110 206 V1161" stroke="#9aa9b8" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/>
<path d="M115 270 H564" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="127" y="262" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">POST /holds  {seats: [A3, A4]}</text>
<path d="M315 315 H564" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="327" y="307" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">POST /holds  {seats: [A4, B1]}</text>
<path d="M570 360 H824" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="700.0" y="352" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">#1 place_hold([A3, A4])</text>
<path d="M570 402 H824" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="700.0" y="394" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">#2 place_hold([A4, B1])</text>
<path d="M830 444 H1104" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="970.0" y="436" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">#1 BEGIN IMMEDIATE: lock acquired</text>
<path d="M830 486 H1104" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="970.0" y="478" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">#2 BEGIN IMMEDIATE: waits</text>
<path d="M830 528 H1104" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="970.0" y="520" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">#1 SELECT held among A3, A4 → none</text>
<path d="M830 570 H1104" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="970.0" y="562" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">#1 INSERT A3, A4; COMMIT</text>
<path d="M830 612 H576" fill="none" stroke="#435970" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="700.0" y="604" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">#1 Reservation &lt;id&gt;, held</text>
<path d="M570 654 H121" fill="none" stroke="#435970" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="127" y="646" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">201  {reservation_id: &lt;id&gt;, status: held}</text>
<path d="M1110 696 H836" fill="none" stroke="#435970" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="970.0" y="688" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">#2 lock granted after the commit</text>
<path d="M830 756 H1104" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="970.0" y="748" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">→ A4; ROLLBACK</text>
<text x="970.0" y="730" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">#2 SELECT held among A4, B1</text>
<path d="M830 798 H576" fill="none" stroke="#435970" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="700.0" y="790" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">#2 SeatsUnavailable([A4])</text>
<path d="M570 840 H321" fill="none" stroke="#435970" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="327" y="832" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">409  {unavailable_seats: [A4]}</text>
<rect x="1135" y="462" width="245" height="64" rx="5" fill="#fff7e6" stroke="#d9a441" stroke-width="1.5"/>
<text x="1145" y="482" font-size="14" font-weight="400" fill="#192e42" text-anchor="start">#2 waits up to 5 s. A timeout</text>
<text x="1145" y="501" font-size="14" font-weight="400" fill="#192e42" text-anchor="start">returns 503 and holds nothing.</text>
<rect x="1135" y="774" width="245" height="64" rx="5" fill="#fff7e6" stroke="#d9a441" stroke-width="1.5"/>
<text x="1145" y="794" font-size="14" font-weight="400" fill="#192e42" text-anchor="start">The rollback wrote nothing,</text>
<text x="1145" y="813" font-size="14" font-weight="400" fill="#192e42" text-anchor="start">so B1 stays available.</text>
<rect x="16" y="880" width="1368" height="40" rx="5" fill="#eef2f6"/>
<text x="700.0" y="905.0" font-size="15" font-weight="700" fill="#182f46" text-anchor="middle">The server restarts. The SQLite file still holds reservation &lt;id&gt; with A3 and A4.</text>
<path d="M115 985 H564" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="127" y="977" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">GET /reservations/&lt;id&gt;</text>
<path d="M570 1027 H824" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="700.0" y="1019" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">get_reservation(&lt;id&gt;)</text>
<path d="M830 1069 H1104" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="970.0" y="1061" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">SELECT reservation and its seats</text>
<path d="M570 1111 H121" fill="none" stroke="#435970" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="127" y="1103" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">200  {status: held, seats: [A3, A4]}</text>
</svg>

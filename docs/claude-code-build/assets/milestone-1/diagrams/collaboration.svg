<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1185" width="1400" height="1185" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">How two overlapping holds are decided</title><desc id="desc">Milestone 1 collaboration. Client 1 asks for A3 and A4 while client 2 asks for A4 and B1. Each request runs in its own worker thread of the Movie Seats API process. The create_app routes call the reservation book, which takes the SQLite write lock with BEGIN IMMEDIATE. Call 1 gets the lock first, finds A3 and A4 free, inserts the reservation and commits, so client 1 receives 201 with the reservation ID. Call 2 then gets the lock, finds A4 held, rolls back and client 2 receives 409 naming A4, leaving B1 available. After a restart the same ID is read from the database file by a new server process. Gray means context, blue means changed and green means new.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#435970"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7d8b99"/></marker></defs>
<rect width="1400" height="1185" fill="white"/>
<text x="28" y="43" font-size="29" font-weight="700" fill="#182f46" text-anchor="start">How two overlapping holds are decided</text>
<text x="28" y="75" font-size="17" font-weight="400" fill="#182f46" text-anchor="start">#1 and #2 run in separate worker threads with their own connections. SQLite&#x27;s write lock orders them.</text>
<rect x="1336" y="20" width="45" height="23" rx="4" fill="#22a06b"/>
<text x="1358.5" y="36" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">new</text>

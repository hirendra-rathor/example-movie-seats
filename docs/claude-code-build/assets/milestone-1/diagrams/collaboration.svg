<text x="1290.5" y="36" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">changed</text>
<rect x="1175" y="20" width="70" height="23" rx="4" fill="#a3a3a3"/>
<text x="1210.0" y="36" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">context</text>
<rect x="430" y="92" width="540" height="778" rx="10" fill="#f3f6f9" stroke="#95a6b5" stroke-width="1.2" stroke-dasharray="7 4"/>
<text x="444" y="114" font-size="13" font-weight="700" fill="#466078" text-anchor="start">MOVIE SEATS API PROCESS (uvicorn)</text>
<rect x="430" y="932" width="540" height="228" rx="10" fill="#f3f6f9" stroke="#95a6b5" stroke-width="1.2" stroke-dasharray="7 4"/>
<text x="444" y="954" font-size="13" font-weight="700" fill="#466078" text-anchor="start">NEW PROCESS AFTER THE RESTART</text>
<rect x="20.0" y="128" width="190" height="78" rx="7" fill="#f9fbfd" stroke="#a3a3a3" stroke-width="2.6"/>
<rect x="130.0" y="117" width="70" height="23" rx="4" fill="#a3a3a3"/>
<text x="165.0" y="133" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">context</text>
<text x="32.0" y="152" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">CALLER</text>
<text x="32.0" y="180" font-size="18" font-weight="700" fill="#182f46" text-anchor="start">Client 1</text>
<text x="32.0" y="198" font-size="13" font-weight="400" fill="#586674" text-anchor="start">booking client</text>

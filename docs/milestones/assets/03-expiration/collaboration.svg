<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1330" viewBox="0 0 1900 1330" role="img"><title>Milestone 3 · Enforce durable deadlines · Collaboration</title><desc>Baseline: milestone 2 implementation (safe completion/retries; 66 tests) · Actual callers, decisions, transaction boundary and recovery.</desc><defs><marker id="new" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16845b"/></marker><marker id="changed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563c9"/></marker><marker id="context" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7d8795"/></marker><marker id="deleted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c83030"/></marker></defs><rect width="100%" height="100%" fill="#f3f6fa"/><text x="50" y="45" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#14283f">Milestone 3 · Enforce durable deadlines · Collaboration</text><text x="50" y="82" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#14283f">Baseline: milestone 2 implementation (safe completion/retries; 66 tests) · Actual callers, decisions, transaction boundary and recovery.</text><rect x="1515" y="20" width="108" height="30" rx="6" fill="#16845b"/><text x="1569" y="41" font-family="Arial" font-size="16" text-anchor="middle" fill="white">new</text><rect x="1635" y="20" width="108" height="30" rx="6" fill="#2563c9"/><text x="1689" y="41" font-family="Arial" font-size="16" text-anchor="middle" fill="white">changed</text><rect x="1755" y="20" width="108" height="30" rx="6" fill="#7d8795"/><text x="1809" y="41" font-family="Arial" font-size="16" text-anchor="middle" fill="white">context</text><path d="M520,292.5 L700,292.5" stroke="#7d8795" stroke-width="2.5" fill="none" marker-end="url(#context)"/><text x="610.0" y="274.5" text-anchor="middle" font-family="Arial" font-size="13" fill="#7d8795">HTTP</text><path d="M700,292.5 H684 V800.0 H700" stroke="#2563c9" stroke-width="2.5" fill="none" marker-end="url(#changed)"/><text transform="translate(679,532.5) rotate(-90)" text-anchor="middle" font-family="Arial" font-size="14" fill="#2563c9">booking operation</text><path d="M1170,800.0 L1350,292.5" stroke="#16845b" stroke-width="2.5" fill="none" marker-end="url(#new)"/><text x="1260.0" y="512.25" text-anchor="middle" font-family="Arial" font-size="13" fill="#16845b">2. read</text><text x="1260.0" y="528.25" text-anchor="middle" font-family="Arial" font-size="13" fill="#16845b">now</text><path d="M1170,800.0 L1350,800.0" stroke="#2563c9" stroke-width="2.5" fill="none" marker-end="url(#changed)"/><text x="1260.0" y="766.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#2563c9">1. lock;</text><text x="1260.0" y="782.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#2563c9">3. expire</text><rect x="50" y="170" width="470" height="245" rx="12" stroke="#7d8795" stroke-width="3" fill="white"/><rect x="408" y="158" width="100" height="27" rx="5" fill="#7d8795"/><text x="458" y="177" font-family="Arial" font-size="15" text-anchor="middle" fill="white">context</text><text x="70" y="204" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f">Booking client</text><text x="70" y="239" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#435873">External consumer</text><text x="70" y="266" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Confirm the held reservation by ID, or read</text><text x="70" y="292" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">availability after downtime.</text><rect x="700" y="170" width="470" height="245" rx="12" stroke="#2563c9" stroke-width="3" fill="white"/><rect x="1058" y="158" width="100" height="27" rx="5" fill="#2563c9"/><text x="1108" y="177" font-family="Arial" font-size="15" text-anchor="middle" fill="white">changed</text><text x="720" y="204" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f">Movie Seats API</text><text x="720" y="239" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#435873">Existing JSON boundary</text><text x="720" y="266" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586778">Today: Returns lifecycle state only.</text><text x="720" y="297" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Proposed: Expose expires_at and expired</text><text x="720" y="323" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">results while retaining status/error</text><text x="720" y="349" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">conventions.</text><rect x="1350" y="170" width="470" height="245" rx="12" stroke="#16845b" stroke-width="3" fill="white"/><rect x="1708" y="158" width="100" height="27" rx="5" fill="#16845b"/><text x="1758" y="177" font-family="Arial" font-size="15" text-anchor="middle" fill="white">new</text><text x="1370" y="204" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f">Host UTC clock</text><text x="1370" y="239" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#435873">clock.py · injected in tests</text><text x="1370" y="266" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586778">Today: No clock dependency.</text><text x="1370" y="297" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Proposed: Sample once after the write lock;</text><text x="1370" y="323" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">now at deadline means the hold is due.</text><rect x="700" y="650" width="470" height="300" rx="12" stroke="#2563c9" stroke-width="3" fill="white"/><rect x="1058" y="638" width="100" height="27" rx="5" fill="#2563c9"/><text x="1108" y="657" font-family="Arial" font-size="15" text-anchor="middle" fill="white">changed</text><text x="720" y="684" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f">Reservation service</text><text x="720" y="719" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#435873">db.py · operation + lifecycle</text><text x="720" y="746" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586778">Today: Reads state, then applies terminal</text><text x="720" y="772" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586778">action.</text><text x="720" y="803" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Proposed: Lock; expire due holds;</text><text x="720" y="829" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">savepoint; decide requested action.</text><text x="720" y="855" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Preserve cleanup when domain work rejects.</text><rect x="1350" y="650" width="470" height="300" rx="12" stroke="#2563c9" stroke-width="3" fill="white"/><rect x="1708" y="638" width="100" height="27" rx="5" fill="#2563c9"/><text x="1758" y="657" font-family="Arial" font-size="15" text-anchor="middle" fill="white">changed</text><text x="1370" y="684" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f">SQLite engine / volume</text><text x="1370" y="719" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#435873">Durable state outside the container</text><text x="1370" y="746" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586778">Today: Stores identities, claims and keys.</text><text x="1370" y="777" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Proposed: Also persist absolute deadlines.</text><text x="1370" y="803" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Commit expiry and claim release together;</text><text x="1370" y="829" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">keep confirmed claims.</text><text x="50" y="1030" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#14283f">ORDER · BEGIN IMMEDIATE -&gt; sample UTC now -&gt; release due held claims -&gt; savepoint -&gt; requested read/write -&gt; commit.</text><text x="50" y="1075" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#14283f">AT DEADLINE · A confirm arriving at 04.900000 but executing at 05.000000 for a 05.000000 deadline returns 409 expired.</text><text x="50" y="1120" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#14283f">REJECTED WORK · Roll back only request work on a domain rejection, then commit expiry. SQL/infrastructure failures roll back the whole transaction.</text><text x="50" y="1165" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#14283f">UPGRADE · Existing held rows receive migration time + configured duration once. Reopening the same file never renews them.</text><text x="50" y="1210" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#14283f">REPLACEMENT · The container mounts /data from a named volume. Startup cleans due holds before serving; confirmed bookings keep their claims.</text></svg>
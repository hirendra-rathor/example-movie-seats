<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1330" viewBox="0 0 1900 1330" role="img"><title>Milestone 1 · Hold a complete selection · Collaboration</title><desc>Baseline: approved starter 81dfa9f (page + health; 2 smoke tests) · Actual callers, decisions, transaction boundary and recovery.</desc><defs><marker id="new" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16845b"/></marker><marker id="changed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563c9"/></marker><marker id="context" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7d8795"/></marker><marker id="deleted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c83030"/></marker></defs><rect width="100%" height="100%" fill="#f3f6fa"/><text x="50" y="45" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#14283f">Milestone 1 · Hold a complete selection · Collaboration</text><text x="50" y="82" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#14283f">Baseline: approved starter 81dfa9f (page + health; 2 smoke tests) · Actual callers, decisions, transaction boundary and recovery.</text><rect x="1635" y="20" width="108" height="30" rx="6" fill="#16845b"/><text x="1689" y="41" font-family="Arial" font-size="16" text-anchor="middle" fill="white">new</text><rect x="1755" y="20" width="108" height="30" rx="6" fill="#2563c9"/><text x="1809" y="41" font-family="Arial" font-size="16" text-anchor="middle" fill="white">changed</text><path d="M520,292.5 L700,292.5" stroke="#16845b" stroke-width="2.5" fill="none" marker-end="url(#new)"/><text x="610.0" y="274.5" text-anchor="middle" font-family="Arial" font-size="13" fill="#16845b">POST seats</text><path d="M1170,292.5 L1350,292.5" stroke="#16845b" stroke-width="2.5" fill="none" marker-end="url(#new)"/><text x="1260.0" y="274.5" text-anchor="middle" font-family="Arial" font-size="13" fill="#16845b">validate</text><path d="M700,292.5 H684 V800.0 H700" stroke="#16845b" stroke-width="2.5" fill="none" marker-end="url(#new)"/><text transform="translate(679,532.5) rotate(-90)" text-anchor="middle" font-family="Arial" font-size="14" fill="#16845b">allocate validated group</text><path d="M1170,800.0 L1350,800.0" stroke="#16845b" stroke-width="2.5" fill="none" marker-end="url(#new)"/><text x="1260.0" y="766.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#16845b">transactio</text><text x="1260.0" y="782.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#16845b">n</text><rect x="50" y="170" width="470" height="245" rx="12" stroke="#16845b" stroke-width="3" fill="white"/><rect x="408" y="158" width="100" height="27" rx="5" fill="#16845b"/><text x="458" y="177" font-family="Arial" font-size="15" text-anchor="middle" fill="white">new</text><text x="70" y="204" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f">Booking client</text><text x="70" y="239" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#435873">Outside the service</text><text x="70" y="266" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586778">Today: No reservation API.</text><text x="70" y="297" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Proposed: POST A3+A4. Keep the returned ID</text><text x="70" y="323" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">for later lookup.</text><rect x="700" y="170" width="470" height="245" rx="12" stroke="#2563c9" stroke-width="3" fill="white"/><rect x="1058" y="158" width="100" height="27" rx="5" fill="#2563c9"/><text x="1108" y="177" font-family="Arial" font-size="15" text-anchor="middle" fill="white">changed</text><text x="720" y="204" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f">Movie Seats API</text><text x="720" y="239" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#435873">api.py · HTTP boundary</text><text x="720" y="266" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586778">Today: Page and health only.</text><text x="720" y="297" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Proposed: Parse the request. Call</text><text x="720" y="323" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">validation, then allocation. Translate</text><text x="720" y="349" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">failures to HTTP.</text><rect x="1350" y="170" width="470" height="245" rx="12" stroke="#16845b" stroke-width="3" fill="white"/><rect x="1708" y="158" width="100" height="27" rx="5" fill="#16845b"/><text x="1758" y="177" font-family="Arial" font-size="15" text-anchor="middle" fill="white">new</text><text x="1370" y="204" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f">Selection policy</text><text x="1370" y="239" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#435873">domain.py · pure validation</text><text x="1370" y="266" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586778">Today: No selection rule.</text><text x="1370" y="297" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Proposed: Known, unique seat IDs; no empty</text><text x="1370" y="323" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">group. Canonical order does not change</text><text x="1370" y="349" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">meaning.</text><rect x="700" y="650" width="470" height="300" rx="12" stroke="#16845b" stroke-width="3" fill="white"/><rect x="1058" y="638" width="100" height="27" rx="5" fill="#16845b"/><text x="1108" y="657" font-family="Arial" font-size="15" text-anchor="middle" fill="white">new</text><text x="720" y="684" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f">Reservation service</text><text x="720" y="719" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#435873">db.py · transaction owner</text><text x="720" y="746" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586778">Today: No persistent store.</text><text x="720" y="777" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Proposed: BEGIN IMMEDIATE; check all</text><text x="720" y="803" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">claims; insert ID, selection and claims;</text><text x="720" y="829" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">COMMIT before 201.</text><rect x="1350" y="650" width="470" height="300" rx="12" stroke="#16845b" stroke-width="3" fill="white"/><rect x="1708" y="638" width="100" height="27" rx="5" fill="#16845b"/><text x="1758" y="657" font-family="Arial" font-size="15" text-anchor="middle" fill="white">new</text><text x="1370" y="684" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f">SQLite engine</text><text x="1370" y="719" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#435873">One local file · durable boundary</text><text x="1370" y="746" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586778">Today: No reservation state.</text><text x="1370" y="777" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Proposed: Primary keys enforce exclusive</text><text x="1370" y="803" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">claims. Rollback failures. A new process</text><text x="1370" y="829" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">reads the same file.</text><text x="50" y="1030" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#14283f">SUCCESS · Commit A3+A4 under one UUID, then return 201. A later GET recovers the same group from the file.</text><text x="50" y="1075" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#14283f">CONFLICT · A3 already held: POST A2+A3 returns 409. Neither a partial reservation nor a claim on A2 survives.</text><text x="50" y="1120" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#14283f">COMPETITION · BEGIN IMMEDIATE serializes independent writers. After the first commit, the second sees B1 claimed.</text><text x="50" y="1165" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#14283f">RECOVERY LIMIT · A lost creation response remains ambiguous without its ID. Safe creation retries belong to milestone 2.</text><text x="50" y="1210" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#14283f">PROPOSED ACCEPTANCE · Real stop/restart preserves A3+A4; an overlap fails; concurrent HTTP requests produce one B1 winner.</text></svg>
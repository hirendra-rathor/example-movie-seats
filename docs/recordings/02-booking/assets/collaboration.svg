<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1330" viewBox="0 0 1900 1330" role="img"><title>Milestone 2 · Finish bookings and recover replies · Collaboration</title><desc>Baseline: fresh milestone 1 edaddef (atomic holds; 33 tests) · Actual callers, decisions, transaction boundary and recovery.</desc><defs><marker id="new" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16845b"/></marker><marker id="changed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563c9"/></marker><marker id="context" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7d8795"/></marker><marker id="deleted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c83030"/></marker></defs><rect width="100%" height="100%" fill="#f3f6fa"/><text x="50" y="45" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#14283f">Milestone 2 · Finish bookings and recover replies · Collaboration</text><text x="50" y="82" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#14283f">Baseline: fresh milestone 1 edaddef (atomic holds; 33 tests) · Actual callers, decisions, transaction boundary and recovery.</text><rect x="1635" y="20" width="108" height="30" rx="6" fill="#16845b"/><text x="1689" y="41" font-family="Arial" font-size="16" text-anchor="middle" fill="white">new</text><rect x="1755" y="20" width="108" height="30" rx="6" fill="#2563c9"/><text x="1809" y="41" font-family="Arial" font-size="16" text-anchor="middle" fill="white">changed</text><path d="M520,292.5 L700,292.5" stroke="#2563c9" stroke-width="2.5" fill="none" marker-end="url(#changed)"/><text x="610.0" y="258.5" text-anchor="middle" font-family="Arial" font-size="13" fill="#2563c9">key or</text><text x="610.0" y="274.5" text-anchor="middle" font-family="Arial" font-size="13" fill="#2563c9">action</text><path d="M1170,292.5 L1350,292.5" stroke="#16845b" stroke-width="2.5" fill="none" marker-end="url(#new)"/><text x="1260.0" y="274.5" text-anchor="middle" font-family="Arial" font-size="13" fill="#16845b">validate</text><path d="M700,292.5 H684 V800.0 H700" stroke="#2563c9" stroke-width="2.5" fill="none" marker-end="url(#changed)"/><text transform="translate(679,532.5) rotate(-90)" text-anchor="middle" font-family="Arial" font-size="14" fill="#2563c9">create / complete</text><path d="M1170,800.0 L1350,800.0" stroke="#2563c9" stroke-width="2.5" fill="none" marker-end="url(#changed)"/><text x="1260.0" y="766.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#2563c9">atomic</text><text x="1260.0" y="782.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#2563c9">write</text><rect x="50" y="170" width="470" height="245" rx="12" stroke="#2563c9" stroke-width="3" fill="white"/><rect x="408" y="158" width="100" height="27" rx="5" fill="#2563c9"/><text x="458" y="177" font-family="Arial" font-size="15" text-anchor="middle" fill="white">changed</text><text x="70" y="204" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f">Booking client</text><text x="70" y="239" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#435873">External consumer</text><text x="70" y="266" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586778">Today: Retries may lose identity.</text><text x="70" y="297" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Proposed: POST A3+A4 with key party-17;</text><text x="70" y="323" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">retain the key before sending.</text><rect x="700" y="170" width="470" height="245" rx="12" stroke="#2563c9" stroke-width="3" fill="white"/><rect x="1058" y="158" width="100" height="27" rx="5" fill="#2563c9"/><text x="1108" y="177" font-family="Arial" font-size="15" text-anchor="middle" fill="white">changed</text><text x="720" y="204" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f">Movie Seats API</text><text x="720" y="239" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#435873">api.py · HTTP boundary</text><text x="720" y="266" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586778">Today: Only create and lookup.</text><text x="720" y="297" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Proposed: Validate key; expose completion</text><text x="720" y="323" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">routes; return 201 creation or 200 replay.</text><rect x="1350" y="170" width="470" height="245" rx="12" stroke="#16845b" stroke-width="3" fill="white"/><rect x="1708" y="158" width="100" height="27" rx="5" fill="#16845b"/><text x="1758" y="177" font-family="Arial" font-size="15" text-anchor="middle" fill="white">new</text><text x="1370" y="204" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f">Lifecycle policy</text><text x="1370" y="239" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#435873">domain.py · decisions</text><text x="1370" y="266" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586778">Today: No completion policy.</text><text x="1370" y="297" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Proposed: Held may finish; repeat the same</text><text x="1370" y="323" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">final is safe; conflicting final returns</text><text x="1370" y="349" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">409.</text><rect x="700" y="650" width="470" height="300" rx="12" stroke="#2563c9" stroke-width="3" fill="white"/><rect x="1058" y="638" width="100" height="27" rx="5" fill="#2563c9"/><text x="1108" y="657" font-family="Arial" font-size="15" text-anchor="middle" fill="white">changed</text><text x="720" y="684" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f">Reservation service</text><text x="720" y="719" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#435873">db.py · write transaction</text><text x="720" y="746" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586778">Today: Allocates each unkeyed call.</text><text x="720" y="777" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Proposed: Look up key before availability.</text><text x="720" y="803" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Compare original seats. Complete only under</text><text x="720" y="829" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">the same write lock.</text><rect x="1350" y="650" width="470" height="300" rx="12" stroke="#2563c9" stroke-width="3" fill="white"/><rect x="1708" y="638" width="100" height="27" rx="5" fill="#2563c9"/><text x="1758" y="657" font-family="Arial" font-size="15" text-anchor="middle" fill="white">changed</text><text x="1370" y="684" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14283f">SQLite engine</text><text x="1370" y="719" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#435873">Durable transaction boundary</text><text x="1370" y="746" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586778">Today: Reservations and claims only.</text><text x="1370" y="777" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">Proposed: Commit key + hold together. On</text><text x="1370" y="803" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">cancellation, commit state + claim release</text><text x="1370" y="829" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14283f">together.</text><text x="50" y="1030" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#14283f">REPLAY · Key party-17 resolves the original ID before checking availability. A replay reports current state; it never creates another hold.</text><text x="50" y="1075" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#14283f">CONFIRM · held -&gt; confirmed keeps all claims. Confirm again returns the same booking. Cancel after confirmation returns 409.</text><text x="50" y="1120" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#14283f">CANCEL · held -&gt; cancelled removes that ID’s claims. Cancel again does nothing, even after someone else acquires those seats.</text><text x="50" y="1165" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#14283f">UPGRADE · The fresh version-1 fixture keeps its ID, A3+A4 selection and claims. A new requests table supplies future retry identity.</text><text x="50" y="1210" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#14283f">COMPATIBILITY · Omitted request_key retains milestone-1 behavior. Requiring a key would break those clients with 422; this proposal avoids that break.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" width="1400" height="1120" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">A deadline that passes while the service is stopped</title><desc id="desc">Milestone 3 collaboration with a 600-second hold time. Container 1 starts on the data volume, upgrades the database and expires due holds. At 12:00:00 the booking client holds A3 and A4 as reservation R, and the reply reports expires_at 12:10:00. At 12:01:00 it holds and confirms B1 as booking S. The operator removes container 1 at 12:02:00. R&#x27;s deadline passes during the downtime. At 12:15:00 the operator starts container 2 on the same volume; before accepting requests it expires R and releases A3 and A4. The client then sees A3 and A4 available and B1 still booked, and confirming R returns 409 expired. Gray means context, blue means changed and green means new.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#435970"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7d8b99"/></marker></defs>
<rect width="1400" height="1120" fill="white"/>
<text x="28" y="43" font-size="29" font-weight="700" fill="#182f46" text-anchor="start">A deadline that passes while the service is stopped</text>
<text x="28" y="75" font-size="17" font-weight="400" fill="#182f46" text-anchor="start">Hold time 600 s. Deadlines are stored wall-clock times, so the downtime counts and the volume keeps them.</text>
<rect x="1336" y="20" width="45" height="23" rx="4" fill="#22a06b"/>
<text x="1358.5" y="36" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">new</text>
<rect x="1253" y="20" width="75" height="23" rx="4" fill="#3b82f6"/>
<text x="1290.5" y="36" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">changed</text>
<rect x="1175" y="20" width="70" height="23" rx="4" fill="#a3a3a3"/>
<text x="1210.0" y="36" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">context</text>
<rect x="15.0" y="128" width="190" height="78" rx="7" fill="#f9fbfd" stroke="#a3a3a3" stroke-width="2.6"/>
<rect x="125.0" y="117" width="70" height="23" rx="4" fill="#a3a3a3"/>
<text x="160.0" y="133" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">context</text>
<text x="27.0" y="152" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">OPERATOR</text>
<text x="27.0" y="180" font-size="18" font-weight="700" fill="#182f46" text-anchor="start">Operator</text>
<text x="27.0" y="198" font-size="13" font-weight="400" fill="#586674" text-anchor="start">docker commands</text>
<path d="M110 206 V1096" stroke="#9aa9b8" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/>
<rect x="215.0" y="128" width="190" height="78" rx="7" fill="#f9fbfd" stroke="#a3a3a3" stroke-width="2.6"/>
<rect x="325.0" y="117" width="70" height="23" rx="4" fill="#a3a3a3"/>
<text x="360.0" y="133" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">context</text>
<text x="227.0" y="152" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">CALLER</text>
<text x="227.0" y="180" font-size="18" font-weight="700" fill="#182f46" text-anchor="start">Booking client</text>
<text x="227.0" y="198" font-size="13" font-weight="400" fill="#586674" text-anchor="start">curl</text>
<path d="M310 206 V1096" stroke="#9aa9b8" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/>
<rect x="445.0" y="128" width="230" height="78" rx="7" fill="#f9fbfd" stroke="#22a06b" stroke-width="2.6"/>
<rect x="620.0" y="117" width="45" height="23" rx="4" fill="#22a06b"/>
<text x="642.5" y="133" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">new</text>
<text x="457.0" y="152" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">CONTAINER 1</text>
<text x="457.0" y="180" font-size="18" font-weight="700" fill="#182f46" text-anchor="start">Movie Seats API</text>
<text x="457.0" y="198" font-size="13" font-weight="400" fill="#586674" text-anchor="start">image with milestone 3</text>
<path d="M560 206 V640" stroke="#9aa9b8" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/>
<rect x="745.0" y="128" width="230" height="78" rx="7" fill="#f9fbfd" stroke="#22a06b" stroke-width="2.6"/>
<rect x="920.0" y="117" width="45" height="23" rx="4" fill="#22a06b"/>
<text x="942.5" y="133" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">new</text>
<text x="757.0" y="152" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">CONTAINER 2</text>
<text x="757.0" y="180" font-size="18" font-weight="700" fill="#182f46" text-anchor="start">Movie Seats API</text>
<text x="757.0" y="198" font-size="13" font-weight="400" fill="#586674" text-anchor="start">same image, new container</text>
<path d="M860 715 V1096" stroke="#9aa9b8" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/>
<path d="M860 206 V715" stroke="#d3dbe3" stroke-width="1.2" stroke-dasharray="2 6" fill="none"/>
<rect x="1020.0" y="128" width="240" height="78" rx="7" fill="#f9fbfd" stroke="#3b82f6" stroke-width="2.6"/>
<rect x="1175.0" y="117" width="75" height="23" rx="4" fill="#3b82f6"/>
<text x="1212.5" y="133" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">changed</text>
<text x="1032.0" y="152" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">STORE ON DATA VOLUME</text>
<text x="1032.0" y="180" font-size="18" font-weight="700" fill="#182f46" text-anchor="start">SQLite file</text>
<text x="1032.0" y="198" font-size="13" font-weight="400" fill="#586674" text-anchor="start">/data/movie-seats.sqlite3</text>
<path d="M1140 206 V1096" stroke="#9aa9b8" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/>
<path d="M110 262 H554" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="122" y="254" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">docker run … -v movie-seats-data:/data</text>
<path d="M560 304 H1134" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="850.0" y="296" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">startup: migrate to v3; expire due holds</text>
<path d="M310 352 H554" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="322" y="344" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">12:00:00  POST /holds [A3, A4]</text>
<path d="M560 404 H1134" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="850.0" y="396" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">INSERT R, expires_at 12:10:00; COMMIT</text>
<text x="850.0" y="378" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">BEGIN IMMEDIATE; expire due holds;</text>
<path d="M560 446 H316" fill="none" stroke="#435970" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="322" y="438" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">201 {R, held, expires_at: 12:10:00}</text>
<path d="M310 494 H554" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="322" y="486" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">12:01:00  hold B1 as S; confirm S</text>
<path d="M560 536 H1134" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="850.0" y="528" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">S: held → confirmed; COMMIT</text>
<path d="M560 578 H316" fill="none" stroke="#435970" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="322" y="570" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">200 {S, confirmed}</text>
<path d="M110 626 H554" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="122" y="618" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">12:02:00  docker rm -f</text>
<path d="M550 630 L570 650 M550 650 L570 630" stroke="#435970" stroke-width="3" stroke-linecap="round"/>
<rect x="16" y="662" width="1368" height="38" rx="5" fill="#eef2f6"/>
<text x="700.0" y="686.0" font-size="15" font-weight="700" fill="#182f46" text-anchor="middle">12:02–12:15  No container runs. R&#x27;s deadline, 12:10:00, passes during the downtime.</text>
<path d="M110 744 H854" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="122" y="736" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">12:15:00  docker run, same volume</text>
<path d="M860 786 H1134" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1000.0" y="778" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">→ R expired; A3, A4 released</text>
<text x="1000.0" y="760" font-size="14" font-weight="600" fill="#344d64" text-anchor="middle">startup: held and expires_at ≤ 12:15:00</text>
<rect x="1160" y="730" width="225" height="82" rx="5" fill="#fff7e6" stroke="#d9a441" stroke-width="1.5"/>
<text x="1170" y="750" font-size="14" font-weight="400" fill="#192e42" text-anchor="start">The sweep commits before</text>
<text x="1170" y="769" font-size="14" font-weight="400" fill="#192e42" text-anchor="start">uvicorn accepts requests;</text>
<text x="1170" y="788" font-size="14" font-weight="400" fill="#192e42" text-anchor="start">every later read also checks.</text>
<path d="M310 836 H854" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="322" y="828" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">12:15:05  GET /seats</text>
<path d="M860 878 H316" fill="none" stroke="#435970" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="322" y="870" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">A3, A4 available; B1 booked</text>
<path d="M310 926 H854" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="322" y="918" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">POST /reservations/R/confirm</text>
<path d="M860 968 H316" fill="none" stroke="#435970" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="322" y="960" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">409 {status: expired}</text>
<path d="M310 1016 H854" fill="none" stroke="#435970" stroke-width="2" marker-end="url(#arrow)"/>
<text x="322" y="1008" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">GET /reservations/S</text>
<path d="M860 1058 H316" fill="none" stroke="#435970" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="322" y="1050" font-size="14" font-weight="600" fill="#344d64" text-anchor="start">200 {status: confirmed, seats: [B1]}</text>
</svg>
